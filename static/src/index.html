<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<link rel="icon" href="/favicon_dark.ico" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="/favicon_light.ico" media="(prefers-color-scheme: dark)" />

		<title>Scratch</title>
	</head>
	<body>
		<div id="auth-layer" class="auth-layer hidden">
			<div class="auth-box">
				<h1>SCRATCH</h1>

				<p>Authentication required</p>

				<input type="password" id="input-auth" placeholder="Access token" autofocus />

				<div id="auth-error"></div>

				<button id="btn-login" class="btn-primary">AUTHENTICATE</button>
			</div>
		</div>

		<div id="prompt-modal" class="modal-layer hidden">
			<div class="modal-box">
				<h2 id="prompt-title">Prompt</h2>

				<input type="text" id="input-prompt" placeholder="..." />

				<div class="modal-actions">
					<button id="btn-prompt-cancel">CANCEL</button>
					<button id="btn-prompt-confirm" class="btn-primary">OK</button>
				</div>
			</div>
		</div>

		<div id="confirm-modal" class="modal-layer hidden">
			<div class="modal-box">
				<h2 id="confirm-title">Confirm</h2>

				<p id="confirm-message" class="modal-message"></p>

				<div class="modal-actions">
					<button id="btn-confirm-cancel">CANCEL</button>
					<button id="btn-confirm-ok" class="btn-danger">DELETE</button>
				</div>
			</div>
		</div>

		<div id="version-modal" class="modal-layer hidden">
			<div class="modal-box version-box">
				<h2 id="version-title"></h2>

				<p id="version-date" class="modal-message"></p>

				<div id="version-tags" class="version-tags"></div>

				<textarea id="version-source" readonly aria-label="Tagged version source"></textarea>

				<div id="version-preview" class="version-preview"></div>

				<div class="modal-actions">
					<button id="btn-version-close">CLOSE</button>
					<button id="btn-version-delete" class="btn-danger">REMOVE TAG</button>
					<button id="btn-version-restore" class="btn-primary">RESTORE</button>
				</div>
			</div>
		</div>

		<div id="app-loader" class="app-loader">
			<div class="spinner"></div>

			<span class="app-loader-text">Connecting...</span>
		</div>

		<div class="layout">
			<aside class="sidebar" id="sidebar">
				<div class="sidebar-header">
					<div class="brand-row">
						<span class="brand">SCRATCH</span>
						<span id="label-version" class="version"></span>
					</div>

					<div class="action-row">
						<button id="btn-new-folder" title="New Folder">
							<i class="icon icon-folder-plus"></i><span>Folder</span>
						</button>
						<button id="btn-new" title="New Note">
							<i class="icon icon-plus"></i><span>Note</span>
						</button>
					</div>
				</div>

				<div id="note-list" class="note-list"></div>

				<div class="sidebar-footer">
					<button id="btn-logout">LOGOUT</button>
				</div>
			</aside>

			<div class="resizer resizer-sidebar" id="resizer-sidebar"></div>

			<main class="editor-pane">
				<div id="empty-state">SELECT OR CREATE A NOTE</div>

				<div id="editor-container" class="editor-container hidden">
					<header class="editor-header">
						<div class="top-bar">
							<input type="text" id="input-title" placeholder="Untitled Note" />

							<div class="actions">
								<span id="status-indicator">READY</span>

								<button id="btn-copy" title="Copy Source">
									<i class="icon icon-copy"></i>
								</button>
								<button id="btn-download" title="Download">
									<i class="icon icon-download"></i>
								</button>
								<button id="btn-delete" class="btn-danger" title="Delete">
									<i class="icon icon-trash"></i>
								</button>
								<button id="btn-close" title="Close Note">
									<i class="icon icon-close"></i>
								</button>
							</div>
						</div>

						<div class="tag-bar" id="tag-container">
							<input type="text" id="input-tag" placeholder="+ tag" />
						</div>
						<div class="version-bar">
							<span>VERSIONS</span>

							<div id="version-list" class="version-list"></div>

							<button id="btn-tag-version" title="Save the current note as a tagged version">+ TAG VERSION</button>
						</div>
					</header>

					<div class="split-view">
						<div class="editor-section" id="editor-section">
							<div class="source-header">
								SOURCE
							</div>

							<textarea id="editor-body" placeholder="Start writing..."></textarea>
						</div>

						<div class="resizer resizer-split" id="resizer-split"></div>

						<div class="preview-section" id="preview-section">
							<div class="preview-header">
								<span>PREVIEW</span>

								<button id="btn-close-preview" title="Close Preview">
									<i class="icon icon-close"></i>
								</button>
							</div>

							<div id="preview-body"></div>
						</div>

						<button id="btn-open-preview" class="hidden" title="Open Preview">
							<i class="icon icon-view"></i>
						</button>

						<div id="loader" class="loader-overlay">
							<div class="spinner"></div>
						</div>
					</div>
				</div>
			</main>
		</div>

		<div id="notification-area"></div>
	</body>
</html>
